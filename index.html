<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>العوني ستور</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:Tahoma,Arial,sans-serif}.nav{background:#181818;color:#fff;padding:11px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}.logo{width:48px;height:48px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#111,#c49535);font-size:27px;font-weight:900}.brand{font-size:22px;font-weight:900}.sp{flex:1}.btn{border:0;border-radius:10px;padding:10px 15px}.gold{background:#b8892e;color:#fff}.dark{background:#222;color:#fff}.wrap{max-width:1200px;margin:auto;padding:18px 15px 90px}.hero{border-radius:18px;min-height:190px;padding:38px 20px;color:#ffe7a2;text-align:center;background:radial-gradient(circle at 50% 10%,#9d782e,#24211b 55%,#111)}.hero h1{font-size:36px;margin:10px}.search{width:100%;border:0;border-radius:35px;background:#e8e8e8;padding:16px 20px;margin:14px 0;outline:0}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:15px}.cat{border:1px solid #ddd;background:#fff;border-radius:25px;padding:9px 17px;white-space:nowrap}.cat.on{background:#b8892e;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #0001}.pic{height:145px;display:grid;place-items:center;font-size:62px;background:linear-gradient(135deg,#171717,#9b7428)}.info{padding:14px}.price{font-weight:bold;color:#9a6b13}.full{width:100%}.modalbg{display:none;position:fixed;inset:0;background:#0008;z-index:40}.modal{background:#fff;border-radius:16px;padding:20px;width:min(700px,94vw);max-height:90vh;overflow:auto;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.close{float:left;border:0;border-radius:50%;width:32px;height:32px}.field,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:5px 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:11px 0}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#a47a2c;color:#fff;display:flex;justify-content:center;gap:38px;align-items:center;z-index:25}.bottom button{background:none;border:0;color:#fff;font-size:17px}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat div{background:#f3ead6;padding:15px;border-radius:10px}.notice{padding:10px;background:#fff3cd;border-radius:9px;margin:8px 0}.hide{display:none!important}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stat{grid-template-columns:repeat(2,1fr)}.brand{font-size:18px}.hero h1{font-size:28px}}@media(max-width:450px){.grid{gap:9px}.pic{height:110px;font-size:50px}.bottom{gap:18px}.bottom button{font-size:14px}}
</style></head><body>
<header class="nav"><div class="logo">K</div><div class="brand">العوني ستور</div><div class="sp"></div><span id="who"></span><button class="btn gold" onclick="authModal()" id="authBtn">دخول</button><button class="btn dark" onclick="cartModal()">🛒 <b id="cc">0</b></button></header>
<main class="wrap"><section class="hero"><h1>متجر العوني الرقمي</h1><p>بطاقات • ألعاب • اشتراكات • خدمات رقمية</p></section><input id="q" class="search" placeholder="ابحث عن منتج..."><div id="cats" class="cats"></div><section id="products" class="grid"></section></main>
<nav class="bottom"><button onclick="load()">⌂ الرئيسية</button><button onclick="cartModal()">🛒 السلة</button><button onclick="ordersModal()">📦 طلباتي</button><button onclick="authModal()">👤 الحساب</button></nav>
<div id="mb" class="modalbg"><div class="modal"><button class="close" onclick="closeM()">×</button><div id="modal"></div></div></div>
<script>
let products=[],active="الكل",me=null,cart=JSON.parse(localStorage.cart||"[]"),coupon=null,config={};
const $=x=>document.getElementById(x);
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});let d=await r.json();if(!r.ok)throw Error(d.error||"حدث خطأ");return d}
async function load(){config=await api("/api/config");products=await api("/api/products");let cs=await api("/api/categories");renderCats(["الكل",...cs]);render()}
function renderCats(cs){$("cats").innerHTML=cs.map(c=>`<button class="cat ${c==active?"on":""}" onclick="active='${c}';renderCats(${JSON.stringify(cs)});render()">${c}</button>`).join("")}
function render(){let q=$("q").value.toLowerCase(),a=products.filter(p=>(active=="الكل"||p.category==active)&&p.name.toLowerCase().includes(q));$("products").innerHTML=a.map(p=>`<article class=card><div class=pic>${p.image||"💎"}</div><div class=info><h3>${p.name}</h3><small>${p.description}</small><p class=price>${p.price} ${p.currency}</p><small>المخزون: ${p.stock}</small><button class="btn dark full" onclick="add(${p.id})" ${p.stock<1?"disabled":""}>أضف للسلة</button></div></article>`).join("")||"<p>لا توجد نتائج.</p>";update()}
function update(){$("cc").textContent=cart.reduce((s,x)=>s+x.qty,0)}
function add(id){let x=cart.find(x=>x.id==id);x?x.qty++:cart.push({id,qty:1});localStorage.cart=JSON.stringify(cart);update();toast("أضيفت للسلة")}
function toast(t){alert(t)}
function closeM(){$("mb").style.display="none"}
function show(h){$("modal").innerHTML=h;$("mb").style.display="block"}
function authModal(){if(me)return show(`<h2>مرحباً ${me.name}</h2><p>${me.email}</p>${me.role=="admin"?'<button class="btn gold full" onclick="adminPanel()">لوحة الإدارة</button>':""}<button class="btn dark full" onclick="logout()">تسجيل الخروج</button>`);show(`<h2>تسجيل الدخول</h2><input class=field id=em placeholder="البريد الإلكتروني"><input class=field id=pw type=password placeholder="كلمة المرور"><button class="btn dark full" onclick="login()">دخول</button><hr><h3>إنشاء حساب</h3><input class=field id=rn placeholder="الاسم"><input class=field id=re placeholder="البريد الإلكتروني"><input class=field id=rp type=password placeholder="كلمة المرور (8 أحرف+)"><button class="btn gold full" onclick="register()">إنشاء حساب</button>`)}
async function login(){try{me=(await api("/api/login",{method:"POST",body:JSON.stringify({email:$("em").value,password:$("pw").value})})).user;closeM();refresh()}catch(e){alert(e.message)}}
async function register(){try{me=(await api("/api/register",{method:"POST",body:JSON.stringify({name:$("rn").value,email:$("re").value,password:$("rp").value})})).user;closeM();refresh()}catch(e){alert(e.message)}}
async function logout(){await api("/api/logout",{method:"POST"});me=null;closeM();refresh()}
function refresh(){$("who").textContent=me?"👤 "+me.name:"";$("authBtn").textContent=me?"حسابي":"دخول"}
function cartModal(){let total=0,rows="";cart=cart.filter(x=>products.some(p=>p.id==x.id));for(let x of cart){let p=products.find(p=>p.id==x.id);total+=p.price*x.qty;rows+=`<div class=row><span>${p.name}<br>${p.price} × ${x.qty}</span><span><button onclick="chg(${p.id},-1)">−</button> <button onclick="chg(${p.id},1)">+</button></span></div>`}let discount=coupon?.discount||0;show(`<h2>السلة</h2>${rows||"<p>السلة فارغة</p>"}<h3>الإجمالي: ${(total-discount).toFixed(2)} TRY</h3>${cart.length?`<input class=field id=couponCode placeholder="كود الخصم"><button class="btn dark full" onclick="applyCoupon(${total})">تطبيق الكوبون</button><br><br><button class="btn gold full" onclick="checkout()">إتمام الطلب</button>`:""}`)}
function chg(id,d){let x=cart.find(x=>x.id==id);x.qty+=d;if(x.qty<1)cart=cart.filter(x=>x.id!=id);localStorage.cart=JSON.stringify(cart);cartModal();update()}
async function applyCoupon(subtotal){try{coupon=await api("/api/coupons/check",{method:"POST",body:JSON.stringify({code:$("couponCode").value,subtotal})});alert("تم تطبيق الخصم");cartModal()}catch(e){alert(e.message)}}
function checkout(){if(!me)return authModal();show(`<h2>بيانات الطلب</h2><input class=field id=on placeholder="الاسم"><input class=field id=oe placeholder="البريد الإلكتروني"><input class=field id=op placeholder="رقم الهاتف"><input class=field id=oa placeholder="العنوان (اختياري)"><button class="btn gold full" onclick="order()">إنشاء الطلب</button>`)}
async function order(){try{let d=await api("/api/orders",{method:"POST",body:JSON.stringify({name:$("on").value,email:$("oe").value,phone:$("op").value,address:$("oa").value,items:cart,couponCode:coupon?.code})});cart=[];coupon=null;localStorage.cart="[]";update();show(`<h2>تم إنشاء الطلب ✅</h2><p>رقم الطلب: <b>${d.order.id}</b></p><p>الإجمالي: ${d.order.total} ${d.order.currency}</p>${config.payments?`<button class="btn gold full" onclick="pay('${d.order.id}')">الدفع الآن</button>`:"<div class=notice>الدفع الإلكتروني غير مفعّل حالياً.</div>"}`);load()}catch(e){alert(e.message)}}
async function pay(id){try{let d=await api("/api/checkout",{method:"POST",body:JSON.stringify({orderId:id})});location.href=d.url}catch(e){alert(e.message)}}
async function ordersModal(){if(!me)return authModal();let a=await api("/api/orders");show("<h2>طلباتي</h2>"+(a.map(o=>`<div class=row><span><b>${o.id}</b><br>${new Date(o.created_at).toLocaleString("ar")}</span><span>${o.total} ${o.currency}<br>${o.status} / ${o.payment_status}</span></div>`).join("")||"<p>لا توجد طلبات.</p>"))}
async function adminPanel(){if(!me||me.role!="admin")return;let [s,p,o,c]=await Promise.all([api("/api/admin/stats"),api("/api/admin/products"),api("/api/admin/orders"),api("/api/admin/coupons")]);show(`<h2>لوحة الإدارة</h2><div class=stat><div>المستخدمون<br><b>${s.users}</b></div><div>المنتجات<br><b>${s.products}</b></div><div>الطلبات<br><b>${s.orders}</b></div><div>المبيعات المدفوعة<br><b>${s.sales} TRY</b></div></div><hr><h3>إضافة منتج</h3><input class=field id=pn placeholder="الاسم"><input class=field id=pc placeholder="التصنيف"><input class=field id=pp type=number placeholder="السعر"><input class=field id=ps type=number placeholder="المخزون"><input class=field id=pd placeholder="الوصف"><input class=field id=pi placeholder="رمز/إيموجي الصورة"><button class="btn gold full" onclick="addProduct()">إضافة المنتج</button><hr><h3>الطلبات</h3>${o.slice(0,20).map(x=>`<div class=row><span>${x.id}<br>${x.total} ${x.currency}</span><select onchange="status('${x.id}',this.value)"><option ${x.status=="pending"?"selected":""}>pending</option><option ${x.status=="paid"?"selected":""}>paid</option><option ${x.status=="processing"?"selected":""}>processing</option><option ${x.status=="completed"?"selected":""}>completed</option><option ${x.status=="cancelled"?"selected":""}>cancelled</option></select></div>`).join("")}<hr><h3>كوبون جديد</h3><input class=field id=cn placeholder="CODE"><select id=ct><option value=percent>نسبة %</option><option value=fixed>مبلغ ثابت</option></select><input class=field id=cv type=number placeholder="القيمة"><button class="btn gold full" onclick="addCoupon()">إضافة كوبون</button><h3>الكوبونات</h3>${c.map(x=>`<div class=row>${x.code} — ${x.type} ${x.value}</div>`).join("")}`)}
async function addProduct(){try{await api("/api/admin/products",{method:"POST",body:JSON.stringify({name:$("pn").value,category:$("pc").value,price:+$("pp").value,stock:+$("ps").value,description:$("pd").value,image:$("pi").value||"💎"})});alert("تم");load();adminPanel()}catch(e){alert(e.message)}}
async function status(id,status){try{await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status})});adminPanel()}catch(e){alert(e.message)}}
async function addCoupon(){try{await api("/api/admin/coupons",{method:"POST",body:JSON.stringify({code:$("cn").value,type:$("ct").value,value:+$("cv").value})});alert("تم");adminPanel()}catch(e){alert(e.message)}}
$("q").oninput=render;
(async()=>{try{me=(await api("/api/me")).user}catch{}refresh();load()})();
</script></body></html>
