<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b98922">
<title>العوني ستور</title>
<style>
*{box-sizing:border-box}
:root{--gold:#b98922;--gold2:#c5962d;--black:#171717;--bg:#f7f7f7;--muted:#e9e9e9}
html,body{margin:0;padding:0;background:var(--bg);color:#181818;font-family:Tahoma,Arial,sans-serif}
body{padding-bottom:88px}
button,input{font:inherit}
button{border:0;cursor:pointer}
.topbar{height:104px;background:#181818;color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;position:sticky;top:0;z-index:30}
.logo{width:92px;height:92px;object-fit:cover;flex:none}
.brand{font-size:24px;font-weight:800;white-space:nowrap;margin-left:auto}
.menu{font-size:36px;color:#fff;background:transparent;width:48px}
.wallet{display:flex;align-items:center;gap:9px;margin-right:auto}
.wallet .diamond{width:53px;height:48px;background:#f5f5f5;border-radius:7px;display:grid;place-items:center;font-size:25px}
.wallet .plus{font-size:24px}
.wallet .balance{font-weight:700;white-space:nowrap}
.flag{font-size:23px}
.wrap{max-width:680px;margin:auto}
main{padding:18px 15px 20px}
.banner{width:100%;height:200px;object-fit:cover;border-radius:20px;display:block;box-shadow:0 3px 12px #0001}
.welcome{background:#fff;margin-top:35px;border-radius:5px;padding:22px 15px;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center;box-shadow:0 1px 8px #0000000b}
.search{width:96%;height:96px;border:0;border-radius:55px;background:#e9e9e9;padding:0 30px;font-size:25px;outline:none;margin:35px auto 55px;display:block;text-align:right}
.section-title{font-size:30px;margin:0 0 20px;font-weight:800}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 34px}
.category{background:#171717;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px #0002;padding:0}
.category img{display:block;width:100%;aspect-ratio:143/247;object-fit:cover}
.products-title{font-size:28px;font-weight:800;margin:20px 0}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #00000012}
.pic{height:190px;background:#171717;display:grid;place-items:center;font-size:82px}
.info{padding:14px}
.name{font-size:19px;line-height:1.5;min-height:58px}
.price{color:var(--gold);font-size:23px;font-weight:800;margin:7px 0 13px}
.add{width:100%;background:var(--gold);color:#fff;padding:13px;border-radius:13px;font-size:17px}
.chat{position:fixed;right:27px;bottom:103px;width:75px;height:75px;border-radius:50%;background:#52c56b;color:#fff;display:grid;place-items:center;font-size:39px;z-index:25;box-shadow:0 4px 15px #0002}
.bottom{position:fixed;bottom:0;left:0;right:0;height:90px;background:var(--gold);z-index:20;display:flex;justify-content:space-around;align-items:center;color:#3b2b0e}
.navbtn{background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;color:#3b2b0e;min-width:70px}
.navicon{font-size:34px;line-height:1}
.home{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--gold);font-size:37px;box-shadow:0 2px 10px #0002}
.drawer{position:fixed;inset:0;background:#0007;z-index:50;display:none}
.drawer.open{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(330px,85%);background:#fff;padding:30px 20px}
.panel h2{margin-top:0}
.panel button{display:block;width:100%;padding:15px;margin:10px 0;background:#f0f0f0;border-radius:12px;text-align:right}
.modalbg{position:fixed;inset:0;background:#0008;z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:min(680px,100%);max-height:85vh;border-radius:25px 25px 0 0;padding:20px;overflow:auto}
.modalbg.open{display:flex}
.close{float:left;background:#eee;border-radius:50%;width:38px;height:38px;font-size:22px}
.cart-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:13px 0}
@media(max-width:560px){
 .topbar{height:104px;padding:10px 10px;gap:7px}
 .logo{width:92px;height:92px}
 .brand{font-size:22px}
 .wallet .balance{font-size:15px}
 .wallet .diamond{width:53px}
 main{padding:18px 15px}
 .banner{height:200px}
 .welcome{font-size:21px}
 .search{height:96px;font-size:24px;margin-bottom:50px}
 .categories{gap:13px}
 .products{gap:12px}
 .pic{height:150px;font-size:65px}
}
@media(max-width:380px){
 .categories{gap:9px}
 .brand{font-size:19px}
 .wallet .balance,.flag{display:none}
}
</style>
</head>
