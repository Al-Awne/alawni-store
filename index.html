<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#b88727">
<title>العوني ستور</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 background:#f5f5f5;
 color:#191919;
 font-family:Tahoma,Arial,sans-serif;
}

body{padding-bottom:82px}

button,input{font-family:inherit}

:root{
 --gold:#b88727;
 --gold2:#d5a73b;
 --dark:#181818;
 --dark2:#242424;
 --white:#fff;
}

.header{
 height:106px;
 background:#191919;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 position:sticky;
 top:0;
 z-index:50;
 box-shadow:0 3px 15px #0004;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:23px;
 font-weight:bold;
 white-space:nowrap;
}

.logo{
 width:72px;
 height:72px;
 border-radius:2px;
 object-fit:cover;
 background:linear-gradient(145deg,#111,#5b4315);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:32px;
 font-weight:bold;
 color:#f3d17a;
 border:1px solid #4c3918;
}

.header-left{
 display:flex;
 align-items:center;
 gap:12px;
}

.balance{
 display:flex;
 align-items:center;
 gap:7px;
 background:#252525;
 padding:12px 16px;
 border-radius:10px;
 color:#eee;
 font-size:15px;
}

.flag{
 font-size:23px;
}

.cart-top{
 border:0;
 background:#f4f4f4;
 color:#222;
 width:52px;
 height:52px;
 border-radius:7px;
 font-size:23px;
}

.menu-btn{
 border:0;
 background:transparent;
 color:#fff;
 font-size:35px;
 cursor:pointer;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:20px 15px;
}

.hero{
 height:205px;
 border-radius:27px;
 overflow:hidden;
 background:
 radial-gradient(circle at 50% 30%,#75551b 0,#332912 20%,#171717 60%),
 linear-gradient(120deg,#171717,#403114);
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 box-shadow:0 4px 15px #0002;
}

.hero:before{
 content:"💵     💰       💵       💰";
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:space-around;
 font-size:42px;
 opacity:.14;
 transform:rotate(-8deg);
}

.hero-content{
 position:relative;
 z-index:2;
 color:#f5d889;
}

.hero h1{
 margin:0 0 18px;
 font-size:34px;
 text-shadow:0 2px 8px #000;
}

.hero p{
 margin:0;
 font-size:19px;
 color:#ffe8a3;
}

.welcome{
 margin:25px 0 18px;
 background:#fff;
 border-radius:8px;
 padding:22px;
 text-align:center;
 font-size:22px;
 box-shadow:0 2px 12px #00000008;
}

.search{
 width:100%;
 border:0;
 outline:0;
 background:#e9e9e9;
 height:70px;
 border-radius:40px;
 padding:0 28px;
 font-size:20px;
 margin-bottom:28px;
}

.search:focus{
 box-shadow:0 0 0 3px #b8872730;
}

.section-title{
 font-size:24px;
 font-weight:bold;
 margin:15px 0;
}

.categories{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
}

.category{
 border:0;
 padding:0;
 border-radius:16px;
 overflow:hidden;
 background:#1b1b1b;
 color:#fff;
 min-height:205px;
 cursor:pointer;
 box-shadow:0 4px 10px #0002;
 transition:.2s;
}

.category:hover{
 transform:translateY(-3px);
}

.cat-img{
 height:135px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:58px;
 background:
 radial-gradient(circle at 50% 20%,#8d6b25,#302610 42%,#191919 75%);
}

.category strong{
 display:block;
 padding:14px 5px;
 font-size:20px;
 line-height:1.4;
}

.products{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-top:18px;
}

.product{
 background:#fff;
 border-radius:15px;
 overflow:hidden;
 box-shadow:0 3px 12px #0001;
}

.product-img{
 height:170px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:65px;
 background:linear-gradient(145deg,#2a2417,#121212);
}

.product-info{
 padding:13px;
}

.product-name{
 font-size:17px;
 font-weight:bold;
 margin-bottom:8px;
}

.price{
 color:#a87719;
 font-size:18px;
 font-weight:bold;
}

.add{
 width:100%;
 border:0;
 background:var(--gold);
 color:#fff;
 border-radius:9px;
 padding:11px;
 margin-top:10px;
 cursor:pointer;
 font-size:15px;
}

.add:active{transform:scale(.98)}

.empty{
 text-align:center;
 padding:40px 10px;
 color:#777;
}

.whatsapp{
 position:fixed;
 right:22px;
 bottom:98px;
 width:65px;
 height:65px;
 border-radius:50%;
 background:#55c76a;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:32px;
 text-decoration:none;
 z-index:60;
 box-shadow:0 4px 14px #0003;
}

.bottom{
 position:fixed;
 bottom:0;
 right:0;
 left:0;
 height:82px;
 background:var(--gold);
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:55;
 box-shadow:0 -3px 15px #0003;
}

.bottom button{
 background:transparent;
 border:0;
 color:#fff;
 font-size:14px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:5px;
 cursor:pointer;
}

.bottom .icon{
 font-size:28px;
}

.bottom .active{
 width:60px;
 height:60px;
 border-radius:50%;
 background:#fff;
 color:var(--gold);
 justify-content:center;
 box-shadow:0 2px 8px #0002;
}

.overlay{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:100;
}

.overlay.show{display:block}

.drawer{
 position:fixed;
 top:0;
 right:-320px;
 width:300px;
 height:100%;
 background:#fff;
 z-index:101;
 transition:.3s;
 padding:22px;
 box-shadow:-5px 0 20px #0004;
}

.drawer.show{right:0}

.drawer-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid #ddd;
 padding-bottom:18px;
 margin-bottom:15px;
}

.drawer h2{
 margin:0;
 color:var(--gold);
}

.close{
 border:0;
 background:#eee;
 border-radius:50%;
 width:40px;
 height:40px;
 font-size:22px;
}

.drawer button{
 width:100%;
 border:0;
 background:#f3f3f3;
 padding:15px;
 margin:6px 0;
 border-radius:9px;
 text-align:right;
 font-size:16px;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:120;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.modal.show{display:flex}

.modal-box{
 background:#fff;
 width:min(500px,100%);
 max-height:85vh;
 overflow:auto;
 border-radius:18px;
 padding:20px;
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #ddd;
 padding-bottom:12px;
 margin-bottom:15px;
}

.modal-head h2{margin:0}

.close-modal{
 border:0;
 background:#eee;
 border-radius:8px;
 width:40px;
 height:40px;
 font-size:22px;
}

.cart-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 border-bottom:1px solid #eee;
 padding:13px 0;
}

.qty{
 display:flex;
 align-items:center;
 gap:8px;
}

.qty button{
 width:32px;
 height:32px;
 border:0;
 background:#eee;
 border-radius:6px;
}

.total{
 font-size:21px;
 font-weight:bold;
 padding:18px 0;
}

.checkout{
 width:100%;
 border:0;
 background:var(--gold);
 color:#fff;
 padding:15px;
 border-radius:10px;
 font-size:17px;
}

@media(max-width:700px){

 .header{
  height:105px;
  padding:0 10px;
 }

 .brand{
  font-size:20px;
 }

 .logo{
  width:62px;
  height:62px;
 }

 .balance{
  padding:10px;
  font-size:12px;
 }

 .cart-top{
  width:47px;
  height:47px;
 }

 .container{
  padding:15px;
 }

 .hero{
  height:200px;
  border-radius:24px;
 }

 .hero h1{
  font-size:30px;
 }

 .hero p{
  font-size:16px;
 }

 .welcome{
  font-size:18px;
  min-height:70px;
 }

 .search{
  height:65px;
  font-size:18px;
 }

 .categories{
  grid-template-columns:repeat(4,1fr);
  gap:10px;
 }

 .category{
  min-height:185px;
  border-radius:14px;
 }

 .cat-img{
  height:125px;
  font-size:47px;
 }

 .category strong{
  font-size:17px;
  padding:10px 3px;
 }

 .products{
  grid-template-columns:repeat(2,1fr);
  gap:10px;
 }

 .product-img{
  height:140px;
 }

 .bottom{
  height:82px;
 }

 .whatsapp{
  bottom:96px;
  right:20px;
 }
}

@media(max-width:430px){

 .header-left .balance{
  display:none;
 }

 .brand{
  font-size:18px;
 }

 .categories{
  gap:8px;
 }

 .category{
  min-height:175px;
 }

 .cat-img{
  height:115px;
 }

 .category strong{
  font-size:15px;
 }

 .product-img{
  height:125px;
 }
}
</style>
</head>

<body>

<header class="header">

 <div class="brand">
  <div class="logo">K</div>
  <span>العوني ستور</span>
 </div>

 <div class="header-left">
  <div class="balance">💎 <span id="balance">TL 0.00</span></div>

  <button class="cart-top" onclick="openCart()">
   🛒 <span id="cartCount">0</span>
  </button>

  <button class="menu-btn" onclick="openMenu()">☰</button>
 </div>

</header>

<main class="container">

 <section class="hero">
  <div class="hero-content">
   <h1>متجر العوني الرقمي</h1>
   <p>بطاقات • ألعاب • اشتراكات • خدمات رقمية</p>
  </div>
 </section>

 <div class="welcome">
  مرحباً بك في متجر العوني الرقمي 👋
 </div>

 <input
  id="search"
  class="search"
  type="search"
  placeholder="ابحث عن منتج..."
  oninput="renderProducts()"
 >

 <div class="section-title">الأقسام</div>

 <section class="categories">

  <button class="category" onclick="filterCategory('ألعاب')">
   <div class="cat-img">🎮</div>
   <strong>قسم الألعاب</strong>
  </button>

  <button class="category" onclick="filterCategory('بطاقات')">
   <div class="cat-img">💳</div>
   <strong>قسم البطاقات</strong>
  </button>

  <button class="category" onclick="filterCategory('تطبيقات')">
   <div class="cat-img">📱</div>
   <strong>قسم التطبيقات</strong>
  </button>

  <button class="category" onclick="filterCategory('بنوك')">
   <div class="cat-img">🏦</div>
   <strong>البنوك الرقمية</strong>
  </button>

  <button class="category" onclick="filterCategory('حوالات')">
   <div class="cat-img">💵</div>
   <strong>الحوالات المالية</strong>
  </button>

  <button class="category" onclick="filterCategory('برامج')">
   <div class="cat-img">💻</div>
   <strong>تفعيل البرامج</strong>
  </button>

  <button class="category" onclick="filterCategory('اشتراكات')">
   <div class="cat-img">📺</div>
   <strong>اشتراك شاشة</strong>
  </button>

  <button class="category" onclick="filterCategory('رصيد')">
   <div class="cat-img">💰</div>
   <strong>قسم الرصيد</strong>
  </button>

 </section>

 <div class="section-title" id="productsTitle">المنتجات</div>

 <section class="products" id="products"></section>

</main>

<a class="whatsapp" href="https://wa.me/" target="_blank">💬</a>

<nav class="bottom">

 <button class="active" onclick="goHome()">
  <span class="icon">⌂</span>
  <span>الرئيسية</span>
 </button>

 <button onclick="openCart()">
  <span class="icon">🛒</span>
  <span>السلة</span>
 </button>

 <button onclick="showOrders()">
  <span class="icon">📦</span>
  <span>طلباتي</span>
 </button>

 <button onclick="showAccount()">
  <span class="icon">👤</span>
  <span>الحساب</span>
 </button>

</nav>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<aside class="drawer" id="drawer">

 <div class="drawer-head">
  <h2>العوني ستور</h2>
  <button class="close" onclick="closeMenu()">×</button>
 </div>

 <button onclick="goHome()">🏠 الرئيسية</button>
 <button onclick="filterCategory('ألعاب')">🎮 الألعاب</button>
 <button onclick="filterCategory('بطاقات')">💳 البطاقات</button>
 <button onclick="filterCategory('تطبيقات')">📱 التطبيقات</button>
 <button onclick="openCart()">🛒 السلة</button>
 <button onclick="showOrders()">📦 طلباتي</button>
 <button onclick="showAccount()">👤 حسابي</button>

</aside>

<div class="modal" id="cartModal">

 <div class="modal-box">

  <div class="modal-head">
   <h2>🛒 سلة المشتريات</h2>
   <button class="close-modal" onclick="closeCart()">×</button>
  </div>

  <div id="cartItems"></div>

  <div class="total">
   الإجمالي: <span id="cartTotal">0.00</span> TL
  </div>

  <button class="checkout" onclick="checkout()">
   إتمام الطلب
  </button>

 </div>

</div>

<div class="modal" id="infoModal">

 <div class="modal-box">

  <div class="modal-head">
   <h2 id="infoTitle">العوني ستور</h2>
   <button class="close-modal" onclick="closeInfo()">×</button>
  </div>

  <div id="infoText"></div>

 </div>

</div>

<script>

const products = [

 {id:1,name:"بطاقة ألعاب رقمية",category:"ألعاب",price:25,icon:"🎮"},
 {id:2,name:"بطاقة Google Play",category:"بطاقات",price:50,icon:"🎁"},
 {id:3,name:"بطاقة Apple",category:"بطاقات",price:50,icon:"🍎"},
 {id:4,name:"اشتراك Netflix",category:"اشتراكات",price:80,icon:"📺"},
 {id:5,name:"اشتراك Shahid",category:"اشتراكات",price:65,icon:"🎬"},
 {id:6,name:"تفعيل برنامج",category:"برامج",price:40,icon:"💻"},
 {id:7,name:"رصيد رقمي",category:"رصيد",price:30,icon:"💰"},
 {id:8,name:"حوالة مالية",category:"حوالات",price:100,icon:"💵"},
 {id:9,name:"خدمة تطبيق",category:"تطبيقات",price:35,icon:"📱"},
 {id:10,name:"خدمة بنك رقمي",category:"بنوك",price:75,icon:"🏦"},
 {id:11,name:"بطاقة شحن",category:"بطاقات",price:20,icon:"💳"},
 {id:12,name:"خدمة ألعاب",category:"ألعاب",price:45,icon:"🕹️"}

];

let activeCategory="الكل";

let cart=JSON.parse(localStorage.getItem("alawni_cart")||"[]");

function saveCart(){
 localStorage.setItem("alawni_cart",JSON.stringify(cart));
 updateCartCount();
}

function updateCartCount(){
 let count=cart.reduce((sum,item)=>sum+item.qty,0);
 document.getElementById("cartCount").textContent=count;
}

function filterCategory(cat){
 activeCategory=cat;
 document.getElementById("productsTitle").textContent="منتجات "+cat;
 renderProducts();
 window.scrollTo({top:500,behavior:"smooth"});
 closeMenu();
}

function goHome(){
 activeCategory="الكل";
 document.getElementById("productsTitle").textContent="المنتجات";
 document.getElementById("search").value="";
 renderProducts();
 window.scrollTo({top:0,behavior:"smooth"});
 closeMenu();
}

function renderProducts(){

 const q=document.getElementById("search").value.trim().toLowerCase();

 const list=products.filter(p=>{

  const cat=activeCategory==="الكل" || p.category===activeCategory;

  const search=!q ||
   p.name.toLowerCase().includes(q) ||
   p.category.toLowerCase().includes(q);

  return cat && search;

 });

 const box=document.getElementById("products");

 if(!list.length){
  box.innerHTML='<div class="empty">لا توجد منتجات مطابقة للبحث.</div>';
  return;
 }

 box.innerHTML=list.map(p=>`

  <article class="product">

   <div class="product-img">
    ${p.icon}
   </div>

   <div class="product-info">

    <div class="product-name">
     ${p.name}
    </div>

    <div class="price">
     ${p.price.toFixed(2)} TL
    </div>

    <button class="add" onclick="addToCart(${p.id})">
     🛒 أضف للسلة
    </button>

   </div>

  </article>

 `).join("");

}

function addToCart(id){

 const item=cart.find(x=>x.id===id);

 if(item){
  item.qty++;
 }else{
  cart.push({id,qty:1});
 }

 saveCart();

 alert("تمت إضافة المنتج إلى السلة 🛒");

}

function openCart(){

 const box=document.getElementById("cartItems");

 if(!cart.length){

  box.innerHTML='<div class="empty">السلة فارغة 🛒</div>';

 }else{

  box.innerHTML=cart.map(item=>{

   const p=products.find(x=>x.id===item.id);

   return `

    <div class="cart-row">

     <div>
      <b>${p.name}</b>
      <br>
      ${p.price} TL × ${item.qty}
     </div>

     <div class="qty">
      <button onclick="changeQty(${p.id},1)">+</button>
      <b>${item.qty}</b>
      <button onclick="changeQty(${p.id},-1)">−</button>
     </div>

    </div>

   `;

  }).join("");

 }

 let total=cart.reduce((sum,item)=>{

  const p=products.find(x=>x.id===item.id);

  return sum+p.price*item.qty;

 },0);

 document.getElementById("cartTotal").textContent=total.toFixed(2);

 document.getElementById("cartModal").classList.add("show");

}

function closeCart(){
 document.getElementById("cartModal").classList.remove("show");
}

function changeQty(id,delta){

 const item=cart.find(x=>x.id===id);

 if(!item)return;

 item.qty+=delta;

 if(item.qty<=0){
  cart=cart.filter(x=>x.id!==id);
 }

 saveCart();
 openCart();

}

function checkout(){

 if(!cart.length){
  alert("السلة فارغة.");
  return;
 }

 alert("تم تجهيز طلبك. يمكنك ربط هذه الخطوة لاحقًا بنظام الدفع والطلبات.");

}

function openMenu(){
 document.getElementById("drawer").classList.add("show");
 document.getElementById("overlay").classList.add("show");
}

function closeMenu(){
 document.getElementById("drawer").classList.remove("show");
 document.getElementById("overlay").classList.remove("show");
}

function showAccount(){

 document.getElementById("infoTitle").textContent="👤 حسابي";

 document.getElementById("infoText").innerHTML=`
  <p>مرحباً بك في متجر العوني.</p>
  <p>يمكنك لاحقاً ربط هذه الصفحة بتسجيل الدخول والحسابات.</p>
 `;

 document.getElementById("infoModal").classList.add("show");
 closeMenu();

}

function showOrders(){

 document.getElementById("infoTitle").textContent="📦 طلباتي";

 document.getElementById("infoText").innerHTML=`
  <p>لا توجد طلبات حالياً.</p>
  <p>بعد ربط قاعدة البيانات ستظهر طلباتك هنا.</p>
 `;

 document.getElementById("infoModal").classList.add("show");
 closeMenu();

}

function closeInfo(){
 document.getElementById("infoModal").classList.remove("show");
}

updateCartCount();
renderProducts();

</script>

</body>
</html>
